services:
  bot:
    build: .
    image: ion-token-gate:local
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN}
      BOT_ADMIN_ID: ${BOT_ADMIN_ID:?Set BOT_ADMIN_ID}
      BOT_GROUP_LANGUAGE: ${BOT_GROUP_LANGUAGE:-ru}
      MANIFEST_URL: ${MANIFEST_URL:-https://ionwallet.io/access-manifest.json}
      WALLETS_LIST_URL: ${WALLETS_LIST_URL:-https://raw.githubusercontent.com/ice-blockchain/wallets-list/refs/heads/master/wallets-v2.json}
      WALLETS: ionwallet
      ION_INDEXER_URL: ${ION_INDEXER_URL:-https://api.mainnet.ice.io}
      ION_STAKING_API_URL: ${ION_STAKING_API_URL:-https://api.ionwallet.io}
      LION_JETTON: ${LION_JETTON:-EQACbwI38RnvclU5Wv6H9zDr8Ao_tq9NWilXxBmoE8yroZlF}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-5}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - ion-token-gate-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  ion-token-gate-data:
